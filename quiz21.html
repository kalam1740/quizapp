<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Bangla Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            color: #1e293b;
            overflow-x: hidden;
            font-size: 13px; /* Smaller default font */
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 12px; /* Smaller radius */
            box-shadow: 0 2px 10px -3px rgba(0, 0, 0, 0.05);
        }

        .input-style {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            transition: all 0.3s ease;
        }

        .input-style:focus {
            border-color: #6366f1;
            outline: none;
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.1);
        }

        .option-btn {
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #334155;
            padding: 6px 10px; /* Compact padding */
        }

        .option-btn:hover {
            background: #f1f5f9;
            border-color: #6366f1;
        }

        .option-btn.selected {
            background: #6366f1 !important;
            color: white !important;
            border-color: #4f46e5;
        }

        .option-btn.selected span {
            color: white !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .hide { display: none !important; }
        
        .error-shake {
            animation: shake 0.5s ease-in-out;
            border-color: #ef4444 !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .solution-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
        }
    </style>
</head>
<body class="py-4 px-3">

    <!-- PAGE 1: Login Screen -->
    <div id="login-page" class="max-w-xs mx-auto text-center mt-12 animate-fade">
        <div class="glass-panel p-6 shadow-lg border border-slate-200">
            <div class="mb-5">
                <div class="inline-block p-2.5 bg-indigo-600 rounded-xl mb-3 shadow-md">
                    <i class="fas fa-calendar-alt text-3xl text-white"></i>
                </div>
                <h1 class="text-xl font-bold mb-1 tracking-tight text-slate-800">দিবস ও ইতিহাস কুইজ</h1>
                <p class="text-slate-500 text-xs font-medium">আপনার নাম লিখে শুরু করুন</p>
            </div>
            
            <div class="relative mb-5">
                <input type="text" id="user-name-input" placeholder="এখানে নাম লিখুন..." 
                       class="input-style w-full p-2.5 rounded-lg text-center text-base">
                <p id="name-error" class="text-red-500 text-[10px] hide font-bold mt-1">নাম লেখা আবশ্যক!</p>
            </div>
            
            <button id="start-btn" onclick="goToQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-lg text-sm transition-all active:scale-95 shadow-md w-full">
                শুরু করুন <i class="fas fa-play ml-1 text-[10px]"></i>
            </button>
        </div>
    </div>

    <!-- PAGE 2: Quiz Question Page -->
    <div id="quiz-page" class="max-w-xl mx-auto hide">
        <!-- Compact Sticky Header -->
        <div class="glass-panel p-2.5 mb-4 sticky top-2 z-10 shadow-md border border-slate-200 flex items-center justify-between">
            <div class="flex items-center">
                <div class="bg-indigo-600 p-1 rounded-md mr-2 shadow-sm">
                    <i class="fas fa-user text-white text-[10px]"></i>
                </div>
                <div>
                    <h2 id="display-user-name" class="text-xs font-bold text-indigo-600 leading-tight">User Name</h2>
                    <span class="text-slate-400 text-[9px] uppercase font-bold">অংশগ্রহণকারী</span>
                </div>
            </div>
            <div class="text-right">
                <p class="font-bold text-slate-700 text-[11px]">গুরুত্বপূর্ণ দিবস কুইজ</p>
                <span class="text-slate-400 text-[9px] uppercase font-bold">সেশন</span>
            </div>
        </div>

        <div id="questions-container" class="space-y-3 mb-8"></div>

        <div class="text-center pb-16">
            <button id="submit-btn" onclick="goToResult()" disabled class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-30 disabled:cursor-not-allowed text-white font-bold py-3 px-10 rounded-xl text-base transition-all shadow-md">
                ফলাফল দেখুন <i class="fas fa-check-circle ml-1"></i>
            </button>
            <p id="pending-msg" class="mt-2 text-slate-400 text-[10px] italic font-medium">সব উত্তর দিলে বাটনটি সক্রিয় হবে</p>
        </div>
    </div>

    <!-- PAGE 3: Final Result Screen -->
    <div id="result-page" class="fixed inset-0 bg-slate-50/95 backdrop-blur-md z-50 flex items-center justify-center hide p-3">
        <div class="glass-panel max-w-xs w-full p-5 text-center animate-fade border border-slate-200 max-h-[90vh] overflow-y-auto">
            <div id="result-icon" class="text-4xl mb-2">🏆</div>
            <h2 class="text-lg font-bold mb-1 text-slate-800"><span id="res-name" class="text-indigo-600">User</span>, অভিনন্দন!</h2>
            <p id="result-msg" class="text-slate-500 text-[11px] mb-3 font-medium">কুইজটি সফলভাবে শেষ করেছেন।</p>
            
            <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-3 mb-5">
                <p class="text-slate-500 uppercase text-[9px] mb-0.5 font-bold">অর্জিত স্কোর</p>
                <div class="text-3xl font-black text-indigo-600">
                    <span id="final-score">0</span><span class="text-base text-slate-400"> / 12</span>
                </div>
            </div>

            <div class="space-y-2.5">
                <!-- Solution Button -->
                <button onclick="toggleSolutions()" id="sol-toggle-btn" class="w-full bg-slate-800 hover:bg-black text-white font-bold py-2 rounded-lg transition-all text-xs flex items-center justify-center space-x-2">
                    <i class="fas fa-eye text-[10px]"></i>
                    <span>সঠিক সমাধান দেখুন</span>
                </button>

                <!-- Solutions Container -->
                <div id="solutions-list" class="hide text-left space-y-2 mt-3 animate-fade"></div>

                <!-- WhatsApp Button -->
                <div class="bg-slate-50 rounded-lg p-2.5 border border-slate-200">
                    <p class="text-slate-500 text-[9px] mb-1.5 font-bold uppercase tracking-widest">পরীক্ষার গ্রুপে যোগ দিন</p>
                    <a href="https://chat.whatsapp.com/H3AmrICM2ObKCgRw9fHGWt" target="_blank" 
                       class="flex items-center justify-center space-x-2 bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-md transition-all transform hover:scale-102 shadow-sm group">
                        <i class="fab fa-whatsapp text-base"></i>
                        <span class="font-bold text-xs">WhatsApp Group</span>
                    </a>
                </div>

                <button onclick="location.reload()" class="w-full border border-slate-200 text-slate-600 font-bold py-2 rounded-lg hover:bg-slate-50 text-xs">
                    আবার শুরু করুন <i class="fas fa-redo ml-1 text-[9px]"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            { question: "ঐতিহাসিক গণঅভ্যুত্থান দিবস কোনটি?", options: ["১০ জানুয়ারি", "২৪ জানুয়ারি", "১৯ ফেব্রুয়ারি", "২৮ ফেব্রুয়ারি"], correct: 1 },
            { question: "১৯৬৯ সালের গণঅভ্যুত্থান দিবস কোনটি?", options: ["২৪ জানুয়ারি", "১৫ ফেব্রুয়ারি", "২১ মার্চ", "২৫ মার্চ"], correct: 0 },
            { question: "পিলখানা হত্যা দিবস কবে?", options: ["২২ ফেব্রুয়ারি", "২৫ ফেব্রুয়ারি", "২৭ ফেব্রুয়ারি", "২৯ ফেব্রুয়ারি"], correct: 1 },
            { question: "জাতীয় পাট দিবস কবে?", options: ["০৬ মার্চ", "০৮ মার্চ", "১৬ মার্চ", "১৮ মার্চ"], correct: 1 },
            { question: "আন্তর্জাতিক নারী দিবস কোনটি?", options: ["৪ এপ্রিল", "৪ মার্চ", "৭ মার্চ", "৮ মার্চ"], correct: 3 },
            { question: "বাংলাদেশে কত তারিখে ‘শিশু দিবস’ উদযাপন করা হয়?", options: ["১৭ মার্চ", "১৭ ফেব্রুয়ারি", "২৬ মার্চ", "২৮ অক্টোবর"], correct: 0 },
            { question: "কোন তারিখে বাংলাদেশের জাতীয় দিবস পালন করা হয়?", options: ["১৬ ডিসেম্বর", "২৬ মার্চ", "৭ মার্চ", "১৭ এপ্রিল"], correct: 1 },
            { question: "বাংলাদেশে কোন তারিখে ‘গণহত্যা দিবস’ পালিত হয়?", options: ["১৪ ডিসেম্বর", "২৫শে মার্চ", "২৬শে মার্চ", "২১শে ফেব্রুয়ারি"], correct: 1 },
            { question: "স্বাধীনতা দিবস কবে?", options: ["১৬ই ডিসেম্বর", "২৬শে মার্চ", "২১শে মার্চ", "১৭ই মার্চ"], correct: 1 },
            { question: "১৭ এপ্রিল তারিখ পালিত হয় কোন দিবস?", options: ["জাতীয় শিশু দিবস", "বঙ্গবন্ধুর দেশে প্রত্যাবর্তন দিবস", "মুজিবনগর দিবস", "ভোক্তা অধিকার দিবস"], correct: 2 },
            { question: "বিশ্ব পরিবেশ দিবস কবে?", options: ["২ ফেব্রুয়ারি", "৩১ মে", "৫ জুন", "১০ ডিসেম্বর"], correct: 2 },
            { question: "ছয়দফা দিবস কবে?", options: ["২৩ ফেব্রুয়ারি", "৭ মার্চ", "১৭ এপ্রিল", "৭ জুন"], correct: 3 }
        ];

        let userName = "";
        let userSelections = new Array(quizData.length).fill(null);

        function goToQuiz() {
            const input = document.getElementById('user-name-input');
            const error = document.getElementById('name-error');
            
            if (input.value.trim() === "") {
                input.classList.add('error-shake');
                error.classList.remove('hide');
                setTimeout(() => input.classList.remove('error-shake'), 500);
                return;
            }

            userName = input.value.trim();
            document.getElementById('login-page').classList.add('hide');
            document.getElementById('quiz-page').classList.remove('hide');
            document.getElementById('display-user-name').innerText = userName;
            renderQuestions();
            window.scrollTo(0, 0);
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = "";
            
            quizData.forEach((item, qIdx) => {
                const card = document.createElement('div');
                card.className = 'glass-panel p-3 animate-fade mb-3';
                card.style.animationDelay = `${qIdx * 0.05}s`;
                
                let optionsHtml = '';
                const labels = ["ক", "খ", "গ", "ঘ"];
                
                item.options.forEach((opt, oIdx) => {
                    optionsHtml += `
                        <button onclick="handleSelect(${qIdx}, ${oIdx}, this)" 
                                class="option-btn w-full rounded-md text-left flex items-center space-x-2 mb-1.5">
                            <span class="w-6 h-6 rounded bg-slate-100 flex items-center justify-center text-[10px] font-bold border border-slate-200 text-indigo-600 transition-colors shrink-0">
                                ${labels[oIdx]}
                            </span>
                            <span class="text-[12px] font-medium leading-tight">${opt}</span>
                        </button>
                    `;
                });

                card.innerHTML = `
                    <h3 class="text-[13px] font-bold mb-2.5 text-slate-800 leading-snug">
                        <span class="bg-indigo-600 text-white w-4 h-4 inline-flex items-center justify-center rounded text-[9px] mr-1.5">${qIdx + 1}</span> 
                        ${item.question}
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                        ${optionsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleSelect(qIdx, oIdx, btn) {
            const parent = btn.parentElement;
            Array.from(parent.querySelectorAll('.option-btn')).forEach(child => {
                child.classList.remove('selected');
            });
            btn.classList.add('selected');
            userSelections[qIdx] = oIdx;
            
            const answeredCount = userSelections.filter(x => x !== null).length;
            if (answeredCount === quizData.length) {
                const submitBtn = document.getElementById('submit-btn');
                submitBtn.disabled = false;
                document.getElementById('pending-msg').classList.add('hide');
            }
        }

        function goToResult() {
            let score = 0;
            userSelections.forEach((val, idx) => {
                if (val === quizData[idx].correct) score++;
            });

            document.getElementById('quiz-page').classList.add('hide');
            document.getElementById('result-page').classList.remove('hide');
            document.getElementById('final-score').innerText = score;
            document.getElementById('res-name').innerText = userName;

            const icon = document.getElementById('result-icon');
            const msg = document.getElementById('result-msg');

            if (score === quizData.length) {
                icon.innerText = "🏆";
                msg.innerText = "অসাধারণ প্রস্তুতি!";
            } else if (score >= 8) {
                icon.innerText = "🌟";
                msg.innerText = "বেশ ভালো প্রস্তুতি।";
            } else {
                icon.innerText = "📚";
                msg.innerText = "আরেকটু রিভিশন প্রয়োজন।";
            }

            buildSolutions();
        }

        function buildSolutions() {
            const solList = document.getElementById('solutions-list');
            const labels = ["ক", "খ", "গ", "ঘ"];
            solList.innerHTML = `<h4 class="text-indigo-600 font-bold border-b border-slate-200 pb-1.5 mb-2.5 text-[10px] flex items-center uppercase">
                <i class="fas fa-list-check mr-1.5"></i> সমাধান গাইড:</h4>`;
            
            quizData.forEach((item, idx) => {
                const isCorrect = userSelections[idx] === item.correct;
                const solCard = document.createElement('div');
                solCard.className = `solution-card ${isCorrect ? 'border-green-100 bg-green-50/20' : 'border-red-100 bg-red-50/20'}`;
                
                solCard.innerHTML = `
                    <div class="flex items-start justify-between mb-0.5">
                        <span class="text-slate-500 text-[8px] font-bold uppercase">#${idx + 1}</span>
                        <i class="fas ${isCorrect ? 'fa-check text-green-500' : 'fa-times text-red-500'} text-[9px]"></i>
                    </div>
                    <p class="text-slate-800 font-bold text-[11px] mb-1.5 leading-tight">${item.question}</p>
                    <div class="space-y-0.5 text-[10px]">
                        <div class="text-green-700 font-bold">সঠিক: ${labels[item.correct]}. ${item.options[item.correct]}</div>
                        <div class="${isCorrect ? 'text-indigo-600' : 'text-red-700'}">আপনার: ${userSelections[idx] !== null ? labels[userSelections[idx]] : 'নাই'}</div>
                    </div>
                `;
                solList.appendChild(solCard);
            });
        }

        function toggleSolutions() {
            const list = document.getElementById('solutions-list');
            const btn = document.getElementById('sol-toggle-btn');
            const isHidden = list.classList.contains('hide');
            
            if (isHidden) {
                list.classList.remove('hide');
                btn.innerHTML = `<i class="fas fa-eye-slash text-[10px]"></i> <span>বন্ধ করুন</span>`;
                setTimeout(() => {
                    list.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            } else {
                list.classList.add('hide');
                btn.innerHTML = `<i class="fas fa-eye text-[10px]"></i> <span>সঠিক সমাধান দেখুন</span>`;
            }
        }
    </script>
</body>
</html>
