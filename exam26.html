<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Bangla Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            min-height: 100vh;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .input-style {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .input-style:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .option-btn {
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
        }

        .option-btn:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: #6366f1;
            transform: translateX(5px);
        }

        .option-btn.selected {
            background: #6366f1 !important;
            border-color: #818cf8;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .progress-glow {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Essential Utility Classes */
        .hide { display: none !important; }
        
        .error-shake {
            animation: shake 0.5s ease-in-out;
            border-color: #ef4444 !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="py-8 px-4">

    <!-- PAGE 1: Login Screen -->
    <div id="login-page" class="max-w-xl mx-auto text-center mt-16 animate-fade">
        <div class="glass-panel p-10 shadow-2xl">
            <div class="mb-8">
                <div class="inline-block p-4 bg-indigo-600 rounded-3xl mb-4 shadow-2xl">
                    <i class="fas fa-user-circle text-6xl text-white"></i>
                </div>
                <h1 class="text-4xl font-bold mb-4 tracking-tight text-white">মেধা যাচাই কুইজ</h1>
                <p class="text-slate-400 text-lg mb-8">কুইজে অংশগ্রহণ করতে আপনার নাম লিখুন</p>
                
                <div class="relative max-w-sm mx-auto">
                    <input type="text" id="user-name-input" placeholder="আপনার নাম এখানে লিখুন..." 
                           class="input-style w-full p-4 rounded-2xl text-center text-xl mb-2">
                    <p id="name-error" class="text-red-400 text-sm hide">অনুগ্রহ করে নাম লিখে শুরু করুন!</p>
                </div>
            </div>
            
            <button onclick="goToQuiz()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 px-12 rounded-2xl text-xl transition-all hover:scale-105 active:scale-95 shadow-lg w-full">
                কুইজ শুরু করুন <i class="fas fa-arrow-right ml-2 text-sm"></i>
            </button>
        </div>
    </div>

    <!-- PAGE 2: Quiz Question Page -->
    <div id="quiz-page" class="max-w-3xl mx-auto hide">
        <!-- Sticky Header -->
        <div class="glass-panel p-6 mb-8 sticky top-4 z-10 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <div class="flex flex-col">
                    <span class="text-slate-400 text-xs uppercase tracking-widest font-bold">অংশগ্রহণকারী</span>
                    <h2 id="display-user-name" class="text-xl font-bold text-indigo-400">User Name</h2>
                </div>
                <div class="text-right">
                    <span id="progress-text" class="text-slate-300 font-bold">0/8 সম্পন্ন</span>
                </div>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-3">
                <div id="progress-bar" class="bg-indigo-500 h-3 rounded-full transition-all duration-500 progress-glow" style="width: 0%"></div>
            </div>
        </div>

        <!-- Questions Container -->
        <div id="questions-container" class="space-y-6 mb-10">
            <!-- Questions will be injected here -->
        </div>

        <!-- Submit Button -->
        <div class="text-center pb-20">
            <button id="submit-btn" onclick="goToResult()" disabled class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-30 disabled:cursor-not-allowed text-white font-bold py-4 px-12 rounded-2xl text-xl transition-all shadow-xl scale-110">
                ফলাফল দেখুন <i class="fas fa-check-double ml-2"></i>
            </button>
        </div>
    </div>

    <!-- PAGE 3: Final Result Screen -->
    <div id="result-page" class="fixed inset-0 bg-slate-950/95 backdrop-blur-lg z-50 flex items-center justify-center hide p-4">
        <div class="glass-panel max-w-lg w-full p-10 text-center animate-fade">
            <div id="result-icon" class="text-8xl mb-6">🏆</div>
            <h2 class="text-3xl font-bold mb-2"><span id="res-name" class="text-indigo-400">User</span>, অভিনন্দন!</h2>
            <p id="result-msg" class="text-slate-400 text-lg mb-8">কুইজটি সফলভাবে সম্পন্ন হয়েছে।</p>
            
            <div class="bg-indigo-600/20 border border-indigo-500/30 rounded-3xl p-8 mb-8">
                <p class="text-slate-300 uppercase tracking-widest text-xs mb-2 font-bold">আপনার অর্জিত স্কোর</p>
                <div class="text-7xl font-black text-indigo-400">
                    <span id="final-score">0</span><span class="text-2xl text-slate-500"> / 8</span>
                </div>
            </div>

            <button onclick="location.reload()" class="w-full bg-white text-slate-900 font-bold py-4 rounded-2xl hover:bg-slate-200 transition-colors text-lg shadow-lg">
                আবার খেলুন <i class="fas fa-undo-alt ml-2"></i>
            </button>
        </div>
    </div>

    <script>
        // Quiz Database
        const quizData = [
            {
                question: "বাংলাদেশের প্রধান বিচারপতি নিয়োগ দেন কে?",
                options: ["জাতীয় সংসদ", "প্রধানমন্ত্রী", "রাষ্ট্রপতি", "সুপ্রিম কোর্ট"],
                correct: 2
            },
            {
                question: "বাংলাদেশের রাষ্ট্রপতি কার নিকট পদত্যাগ করেন?",
                options: ["প্রধানমন্ত্রী", "স্পীকার", "প্রধান বিচারপতি", "কোনোটিই নয়"],
                correct: 1
            },
            {
                question: "বাংলাদেশের রাষ্ট্রপতি কিভাবে নির্বাচিত হন?",
                options: ["জনগণের সরাসরি ভোটে", "জাতীয় সংসদ সদস্যদের ভোটে", "প্রধানমন্ত্রী কর্তৃক", "প্রধান বিচারপতি কর্তৃক"],
                correct: 1
            },
            {
                question: "প্রধানমন্ত্রীর নিয়োগের বাইরে রাষ্ট্রপতি প্রধানমন্ত্রীর পরামর্শ ব্যতীত কোন কাজ এককভাবে করতে পারেন?",
                options: ["প্রধান বিচারপতি নিয়োগ", "প্রধান নির্বাচন কমিশনার নিয়োগ", "অডিটর জেনারেল নিয়োগ", "পাবলিক সার্ভিসেস কমিশনারের চেয়ারম্যান নিয়োগ"],
                correct: 0
            },
            {
                question: "রাষ্ট্রপতি কোন ধারার বিধানমতে কারো সাথে কোনো পরামর্শ ছাড়াই প্রধান বিচারপতি নিয়োগ দিতে পারেন?",
                options: ["৪৪ ধারা", "৪৮ (৩) ধারা", "৭ (১) ধারা", "৭ (২) ধারা"],
                correct: 1
            },
            {
                question: "বাংলাদেশের সংবিধানের কত নম্বর অনুচ্ছেদে রাষ্ট্রপতির সাধারণ ক্ষমা সংক্রান্ত বিধান রয়েছে?",
                options: ["২৭", "৪৯", "৫৪", "৫২"],
                correct: 1
            },
            {
                question: "বাংলাদেশের সংবিধান অনুযায়ী কোনো ব্যক্তিকে রাষ্ট্রপতি হতে হলে তাঁর বয়স কমপক্ষে কত বছর হবে?",
                options: ["২৫", "৩০", "৩৫", "৪০"],
                correct: 2
            },
            {
                question: "'রাষ্ট্রপতির দায়মুক্তি' বাংলাদেশ সংবিধানের কত নম্বর অনুচ্ছেদে বর্ণিত আছে?",
                options: ["৪৮", "৫১", "৬৭", "১২৮"],
                correct: 1
            }
        ];

        let userName = "";
        let userSelections = new Array(quizData.length).fill(null);

        // Step 1: Login to Quiz
        function goToQuiz() {
            const input = document.getElementById('user-name-input');
            const error = document.getElementById('name-error');
            
            if (input.value.trim() === "") {
                input.classList.add('error-shake');
                error.classList.remove('hide');
                setTimeout(() => input.classList.remove('error-shake'), 500);
                return;
            }

            userName = input.value.trim();
            
            // UI Transition
            document.getElementById('login-page').classList.add('hide');
            document.getElementById('quiz-page').classList.remove('hide');
            document.getElementById('display-user-name').innerText = userName;
            
            renderQuestions();
            window.scrollTo(0, 0);
        }

        // Step 2: Build Question Cards
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = ""; // Clear just in case
            
            quizData.forEach((item, qIdx) => {
                const card = document.createElement('div');
                card.className = 'glass-panel p-8 animate-fade';
                card.style.animationDelay = `${qIdx * 0.1}s`;
                
                let optionsHtml = '';
                const labels = ["ক", "খ", "গ", "ঘ"];
                
                item.options.forEach((opt, oIdx) => {
                    optionsHtml += `
                        <button onclick="handleSelect(${qIdx}, ${oIdx}, this)" 
                                class="option-btn w-full p-4 rounded-xl text-left flex items-center space-x-4 mb-3">
                            <span class="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center text-lg font-bold border border-slate-700 text-indigo-400">
                                ${labels[oIdx]}
                            </span>
                            <span class="text-lg text-slate-200">${opt}</span>
                        </button>
                    `;
                });

                card.innerHTML = `
                    <h3 class="text-xl font-bold mb-6 text-slate-100 leading-relaxed">
                        <span class="bg-indigo-600/30 text-indigo-400 px-3 py-1 rounded-lg mr-2">${qIdx + 1}</span> 
                        ${item.question}
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${optionsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Handle Option Selection
        function handleSelect(qIdx, oIdx, btn) {
            const parent = btn.parentElement;
            // Remove selection from siblings
            Array.from(parent.querySelectorAll('.option-btn')).forEach(child => {
                child.classList.remove('selected');
            });
            // Add selection to clicked
            btn.classList.add('selected');

            userSelections[qIdx] = oIdx;
            
            // Update Progress
            const answered = userSelections.filter(x => x !== null).length;
            const progress = (answered / quizData.length) * 100;
            
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('progress-text').innerText = `${answered}/${quizData.length} সম্পন্ন`;
            
            // Enable submit if all answered
            if (answered === quizData.length) {
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('submit-btn').classList.add('scale-110', 'pulse');
            }
        }

        // Step 3: Show Final Result
        function goToResult() {
            let score = 0;
            userSelections.forEach((val, idx) => {
                if (val === quizData[idx].correct) score++;
            });

            // UI Transition
            document.getElementById('quiz-page').classList.add('hide');
            document.getElementById('result-page').classList.remove('hide');
            
            // Data Update
            document.getElementById('final-score').innerText = score;
            document.getElementById('res-name').innerText = userName;

            // Feedback Logic
            const icon = document.getElementById('result-icon');
            const msg = document.getElementById('result-msg');

            if (score === quizData.length) {
                icon.innerText = "🏆";
                msg.innerText = "চমৎকার! আপনি প্রতিটি প্রশ্নের সঠিক উত্তর দিয়েছেন।";
            } else if (score >= 5) {
                icon.innerText = "🌟";
                msg.innerText = "বেশ ভালো! আপনার প্রস্তুতি অনেক ভালো দেখাচ্ছে।";
            } else {
                icon.innerText = "📚";
                msg.innerText = "আরেকটু অনুশীলনের প্রয়োজন। নিয়মিত পড়াশোনা করুন!";
            }
        }
    </script>
</body>
</html>
