<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Exam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            color: #1e293b;
            overflow-x: hidden;
            font-size: 13px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.05);
        }

        .input-style {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            transition: all 0.3s ease;
        }

        .input-style:focus {
            border-color: #6366f1;
            outline: none;
            box-shadow: 0 0 6px rgba(99, 102, 241, 0.1);
        }

        .option-btn {
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #334155;
            padding: 8px 10px;
        }

        .option-btn:hover {
            background: #f1f5f9;
            border-color: #6366f1;
        }

        .option-btn.selected {
            background: #6366f1 !important;
            color: white !important;
            border-color: #4f46e5;
        }

        .option-btn.selected span {
            color: white !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.3s ease-out forwards;
        }

        .hide { display: none !important; }
        
        .error-shake {
            animation: shake 0.4s ease-in-out;
            border-color: #ef4444 !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .solution-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px;
        }
    </style>
</head>
<body class="py-4 px-2">

    <!-- পেজ ১: লগইন স্ক্রিন -->
    <div id="login-page" class="max-w-xs mx-auto text-center mt-12 animate-fade">
        <div class="glass-panel p-5 shadow-lg border border-slate-200">
            <div class="mb-4">
                <div class="inline-block p-2 bg-indigo-600 rounded-lg mb-2 shadow-md">
                    <i class="fas fa-brain text-2xl text-white"></i>
                </div>
                <!-- পরিবর্তিত টাইটেল -->
                <h1 class="text-lg font-bold mb-1 tracking-tight text-slate-800">মেধা যাচাই করুন</h1>
                <p class="text-slate-500 text-[11px] font-medium">আপনার নাম লিখে কুইজ শুরু করুন</p>
            </div>
            
            <div class="relative mb-4">
                <input type="text" id="user-name-input" placeholder="নাম এখানে লিখুন..." 
                       class="input-style w-full p-2 rounded-md text-center text-sm">
                <p id="name-error" class="text-red-500 text-[9px] hide font-bold mt-1">নাম লেখা আবশ্যক!</p>
            </div>
            
            <button id="start-btn" onclick="goToQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-md text-xs transition-all active:scale-95 shadow-md w-full">
                শুরু করুন <i class="fas fa-play ml-1 text-[8px]"></i>
            </button>
        </div>
    </div>

    <!-- পেজ ২: কুইজ প্রশ্ন পেজ -->
    <div id="quiz-page" class="max-w-lg mx-auto hide">
        <!-- স্টিকি হেডার -->
        <div class="glass-panel p-2 mb-3 sticky top-2 z-10 shadow-md border border-slate-200 flex items-center justify-between">
            <div class="flex items-center">
                <div class="bg-indigo-600 p-1 rounded-md mr-1.5 shadow-sm">
                    <i class="fas fa-user text-white text-[9px]"></i>
                </div>
                <div>
                    <h2 id="display-user-name" class="text-[11px] font-bold text-indigo-600 leading-tight">User Name</h2>
                    <span class="text-slate-400 text-[8px] uppercase font-bold">অংশগ্রহণকারী</span>
                </div>
            </div>
            <div class="text-right">
                <p class="font-bold text-slate-700 text-[10px]">সাধারণ জ্ঞান সেশন</p>
                <span class="text-slate-400 text-[8px] uppercase font-bold">মেধা যাচাই</span>
            </div>
        </div>

        <div id="questions-container" class="space-y-2 mb-6"></div>

        <div class="text-center pb-12">
            <button id="submit-btn" onclick="goToResult()" disabled class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-30 disabled:cursor-not-allowed text-white font-bold py-2.5 px-8 rounded-lg text-sm transition-all shadow-md">
                ফলাফল দেখুন <i class="fas fa-check-circle ml-1"></i>
            </button>
            <p id="pending-msg" class="mt-2 text-slate-400 text-[9px] italic font-medium">সব উত্তর দিলে বাটনটি সক্রিয় হবে</p>
        </div>
    </div>

    <!-- পেজ ৩: ফলাফল পেজ -->
    <div id="result-page" class="fixed inset-0 bg-slate-50/95 backdrop-blur-md z-50 flex items-center justify-center hide p-2">
        <div class="glass-panel max-w-xs w-full p-4 text-center animate-fade border border-slate-200 max-h-[90vh] overflow-y-auto">
            <div id="result-icon" class="text-3xl mb-1">🏆</div>
            <h2 class="text-base font-bold mb-0.5 text-slate-800"><span id="res-name" class="text-indigo-600">User</span>, অভিনন্দন!</h2>
            <p id="result-msg" class="text-slate-500 text-[10px] mb-2 font-medium">কুইজটি সফলভাবে শেষ করেছেন।</p>
            
            <div class="bg-indigo-50 border border-indigo-100 rounded-md p-2 mb-3">
                <p class="text-slate-500 uppercase text-[8px] mb-0 font-bold">অর্জিত স্কোর</p>
                <div class="text-2xl font-black text-indigo-600">
                    <span id="final-score">0</span><span class="text-xs text-slate-400"> / 23</span>
                </div>
            </div>

            <div class="space-y-2">
                <button onclick="toggleSolutions()" id="sol-toggle-btn" class="w-full bg-slate-800 hover:bg-black text-white font-bold py-1.5 rounded-md transition-all text-[10px] flex items-center justify-center space-x-1.5">
                    <i class="fas fa-eye text-[9px]"></i>
                    <span>সঠিক সমাধান দেখুন</span>
                </button>

                <div id="solutions-list" class="hide text-left space-y-1.5 mt-2 animate-fade"></div>

                <div class="bg-slate-50 rounded-md p-2 border border-slate-200">
                    <p class="text-slate-500 text-[8px] mb-1 font-bold uppercase tracking-widest">পরীক্ষার গ্রুপে যোগ দিন</p>
                    <a href="https://chat.whatsapp.com/H3AmrICM2ObKCgRw9fHGWt" target="_blank" 
                       class="flex items-center justify-center space-x-1.5 bg-green-600 hover:bg-green-700 text-white px-2 py-1.5 rounded transition-all transform hover:scale-102 shadow-sm group">
                        <i class="fab fa-whatsapp text-sm"></i>
                        <span class="font-bold text-[11px]">WhatsApp Group</span>
                    </a>
                </div>

                <button onclick="location.reload()" class="w-full border border-slate-200 text-slate-600 font-bold py-1.5 rounded-md hover:bg-slate-50 text-[10px]">
                    আবার শুরু করুন <i class="fas fa-redo ml-1 text-[8px]"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            { question: "বাংলাদেশে শতকরা কত ভাগ বনভূমি আছে?", options: ["১৫", "১৭", "১৯", "২২"], correct: 1 },
            { question: "পরিবেশ রক্ষায় একটি দেশের কত শতাংশ বনভূমি প্রয়োজন?", options: ["১৫%", "২০%", "২৫%", "৩০%"], correct: 2 },
            { question: "বাংলাদেশ বন গবেষণা কেন্দ্র কোথায় অবস্থিত?", options: ["রাজশাহী", "কুমিল্লা", "চট্টগ্রাম", "গাজীপুর"], correct: 2 },
            { question: "বাংলাদেশের বৃহত্তম বনভূমি কোনটি?", options: ["পার্বত্য চট্টগ্রাম বনাঞ্চল", "সুন্দরবন বনাঞ্চল", "মধুপুর বনাঞ্চল", "সিলেট বনাঞ্চল"], correct: 0 },
            { question: "ম্যানগ্রোভ বনাঞ্চল বলতে কী বোঝেন?", options: ["কেওড়া বন", "উপকূলীয় বন", "শালবন", "মানবসৃষ্ট বন"], correct: 1 },
            { question: "বিশ্বের সর্ববৃহৎ ম্যানগ্রোভ অরণ্য কোথায়?", options: ["ব্রাজিল", "যুক্তরাজ্য", "কেনিয়া", "বাংলাদেশ"], correct: 3 },
            { question: "বাংলাদেশে কয়টি জেলার সাথে ‘সুন্দরবন’ সংযুক্ত আছে?", options: ["৪টি", "৫টি", "৬টি", "৭টি"], correct: 1 },
            { question: "কোনটিকে বাংলাদেশের ফুসফুস বলা যেতে পারে?", options: ["চলন বিল", "হাকালুকি হাওড়", "সুন্দরবন", "লাউছড়া"], correct: 2 },
            { question: "বাংলাদেশের অন্তর্গত সুন্দরবনের আয়তন কত?", options: ["২০০ বর্গমাইল", "১২৫ বর্গমাইল", "১৯৭০ বর্গমাইল", "২৪০০ বর্গমাইল"], correct: 3 },
            { question: "সুন্দরবনের প্রধান বৃক্ষ কী কী?", options: ["সুন্দরী ও গর্জুন", "সুন্দরী ও গামার", "সুন্দর ও গরান", "সুন্দরী ও সেগুন"], correct: 2 },
            { question: "সুন্দরবনে বাঘ গণনার জন্য ব্যবহৃত পদ্ধতি কোনটি?", options: [" এলাকার স্যাম্পলিং", "হরিণের সংখ্যা", "পাগমার্ক", "বন প্রহরীদের তথ্য"], correct: 2 },
            { question: "রাতারগুল কোন জেলায় অবস্থিত?", options: ["রাঙ্গামাটি", "সাতক্ষীরা", "সিলেট", "কক্সবাজার"], correct: 2 },
            { question: "রাতারগুল কোথায় অবস্থিত?", options: ["কোম্পানীগঞ্জে", "কানাইঘাটে", "ছাতকে", "গোয়াইনঘাটে"], correct: 3 },
            { question: "কোনটি ‘রামসার সাইট’?", options: ["হাকালুকি হাওড়", "মারজাত বাওর", "টাঙ্গুয়ার হাওড়", "সেন্টমার্টিন"], correct: 2 },
            { question: "ইউনেস্কোর বিশ্ব ঐতিহ্যবাহী স্থান কোনটি?", options: ["পাহাড়পুর বৌদ্ধ বিহার", "ময়নামতি", "পানাম নগর", "কাজীজী মন্দির"], correct: 0 },
            { question: "বাংলাদেশে বর্তমানে ইউনেস্কো ঘোষিত কয়টি বিশ্ব ঐতিহ্য রয়েছে?", options: ["৪টি", "৩টি", "৫টি", "৬টি"], correct: 1 },
            { question: "আন্তর্জাতিক কোন সংস্থা সুন্দরবনকে বিশ্ব ঐতিহ্যের অংশ ঘোষণা করে?", options: ["UNICEF", "UNDP", "UNESCO", "ILO"], correct: 2 },
            { question: "ইউনেস্কো সুন্দরবনকে বিশ্বঐতিহ্য হিসেবে স্বীকৃতি দেয় কত তারিখে?", options: ["৭ জানুয়ারি ১৯৯৫", "২ নভেম্বর ১৯৯৬", "২৮ অক্টোবর ১৯৯৭", "৬ ডিসেম্বর ১৯৯৭"], correct: 3 },
            { question: "সুন্দরবন ইউনেস্কো ঘোষিত কততম ওয়ার্ল্ড হেরিটেজ?", options: ["৫২২তম", "৬২০তম", "৭৯৮তম", "৮৯৮তম"], correct: 2 },
            { question: "সুন্দরবনকে বিশ্ব ঐতিহ্যের অংশ ঘোষণা করে কোন সংস্থা?", options: ["UNICEF", "UNIAID", "UNESCO", "UNCTAD"], correct: 2 },
            { question: "কোনটি প্রত্নতাত্ত্বিক স্থান হিসেবে স্বীকৃত নয়?", options: ["পাহাড়পুর", "মহাস্থানগড়", "ময়নামতি", "সুন্দরবন"], correct: 3 },
            { question: "কোন সংস্থা ‘মঙ্গল শোভাযাত্রা’ কে আন্তর্জাতিক স্বীকৃতি দিয়েছে?", options: ["UNICEF", "UNESCO", "বাংলা একাডেমি", "মাতৃভাষা ইন্সটিটিউট"], correct: 1 },
            { question: "কোন গানকে ইউনেস্কো Heritage of Humanity ঘোষণা করেছে?", options: ["রবীন্দ্র সংগীত", "নজরুল সংগীত", "ভাটিয়ালি গান", "বাউল গান"], correct: 3 }
        ];

        let userName = "";
        let userSelections = new Array(quizData.length).fill(null);

        function goToQuiz() {
            const input = document.getElementById('user-name-input');
            const error = document.getElementById('name-error');
            if (input.value.trim() === "") {
                input.classList.add('error-shake');
                error.classList.remove('hide');
                setTimeout(() => input.classList.remove('error-shake'), 400);
                return;
            }
            userName = input.value.trim();
            document.getElementById('login-page').classList.add('hide');
            document.getElementById('quiz-page').classList.remove('hide');
            document.getElementById('display-user-name').innerText = userName;
            renderQuestions();
            window.scrollTo(0, 0);
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = "";
            quizData.forEach((item, qIdx) => {
                const card = document.createElement('div');
                card.className = 'glass-panel p-3 animate-fade mb-2.5';
                card.style.animationDelay = `${qIdx * 0.03}s`;
                let optionsHtml = '';
                const labels = ["ক", "খ", "গ", "ঘ"];
                item.options.forEach((opt, oIdx) => {
                    optionsHtml += `
                        <button onclick="handleSelect(${qIdx}, ${oIdx}, this)" 
                                class="option-btn w-full rounded-md text-left flex items-center space-x-2 mb-1.5">
                            <span class="w-5 h-5 rounded bg-slate-100 flex items-center justify-center text-[9px] font-bold border border-slate-200 text-indigo-600 transition-colors shrink-0">
                                ${labels[oIdx]}
                            </span>
                            <span class="text-[14px] font-semibold leading-tight text-slate-700">${opt}</span>
                        </button>`;
                });
                card.innerHTML = `
                    <h3 class="text-[12px] font-bold mb-2 text-slate-800 leading-snug">
                        <span class="bg-indigo-600 text-white w-4 h-4 inline-flex items-center justify-center rounded text-[8px] mr-1.5">${qIdx + 1}</span> 
                        ${item.question}
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-2">
                        ${optionsHtml}
                    </div>`;
                container.appendChild(card);
            });
        }

        function handleSelect(qIdx, oIdx, btn) {
            const parent = btn.parentElement;
            Array.from(parent.querySelectorAll('.option-btn')).forEach(child => child.classList.remove('selected'));
            btn.classList.add('selected');
            userSelections[qIdx] = oIdx;
            const answeredCount = userSelections.filter(x => x !== null).length;
            if (answeredCount === quizData.length) {
                const submitBtn = document.getElementById('submit-btn');
                submitBtn.disabled = false;
                document.getElementById('pending-msg').classList.add('hide');
            }
        }

        function goToResult() {
            let score = 0;
            userSelections.forEach((val, idx) => { if (val === quizData[idx].correct) score++; });
            document.getElementById('quiz-page').classList.add('hide');
            document.getElementById('result-page').classList.remove('hide');
            document.getElementById('final-score').innerText = score;
            document.getElementById('res-name').innerText = userName;
            const icon = document.getElementById('result-icon');
            const msg = document.getElementById('result-msg');
            if (score === quizData.length) { icon.innerText = "🏆"; msg.innerText = "অবিশ্বাস্য প্রস্তুতি!"; }
            else if (score >= 15) { icon.innerText = "🌟"; msg.innerText = "বেশ ভালো প্রস্তুতি।"; }
            else { icon.innerText = "📚"; msg.innerText = "আরেকটু রিভিশন প্রয়োজন।"; }
            buildSolutions();
        }

        function buildSolutions() {
            const solList = document.getElementById('solutions-list');
            const labels = ["ক", "খ", "গ", "ঘ"];
            solList.innerHTML = `<h4 class="text-indigo-600 font-bold border-b border-slate-200 pb-1 mb-2 text-[9px] flex items-center uppercase">
                <i class="fas fa-list-check mr-1.5"></i> সমাধান গাইড:</h4>`;
            quizData.forEach((item, idx) => {
                const isCorrect = userSelections[idx] === item.correct;
                const solCard = document.createElement('div');
                solCard.className = `solution-card mb-1.5 ${isCorrect ? 'border-green-100 bg-green-50/10' : 'border-red-100 bg-red-50/10'}`;
                solCard.innerHTML = `
                    <p class="text-slate-800 font-bold text-[10px] mb-1 leading-tight">${idx + 1}. ${item.question}</p>
                    <div class="text-[9px]">
                        <span class="text-green-700 font-bold">সঠিক: ${labels[item.correct]}. ${item.options[item.correct]}</span><br>
                        <span class="${isCorrect ? 'text-indigo-600' : 'text-red-700'}">আপনার: ${userSelections[idx] !== null ? labels[userSelections[idx]] : 'নাই'}</span>
                    </div>`;
                solList.appendChild(solCard);
            });
        }

        function toggleSolutions() {
            const list = document.getElementById('solutions-list');
            const btn = document.getElementById('sol-toggle-btn');
            const isHidden = list.classList.contains('hide');
            if (isHidden) {
                list.classList.remove('hide');
                btn.innerHTML = `<i class="fas fa-eye-slash text-[9px]"></i> <span>বন্ধ করুন</span>`;
                setTimeout(() => { list.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
            } else {
                list.classList.add('hide');
                btn.innerHTML = `<i class="fas fa-eye text-[9px]"></i> <span>সঠিক সমাধান দেখুন</span>`;
            }
        }
    </script>
</body>
</html>
